function trustedProduct(value) {
  try {
    const u = new URL(String(value));
    if (u.protocol !== 'https:' || u.username || u.password || (u.port && u.port !== '443')) return null;
    const host = u.hostname.replace(/^www\./, '');
    const stores = {
      'uniqlo.com': ['UNIQLO', /\/products\/[A-Z0-9-]+/i],
      'nike.com': ['Nike', /\/t\/[^/]+\/[^/]+/i],
      'adidas.com': ['adidas', /\/[A-Z0-9]{6,}\.html$/i],
      'hm.com': ['H&M', /\/productpage\.\d+\.html$/i],
      'www2.hm.com': ['H&M', /\/productpage\.\d+\.html$/i],
      'zara.com': ['Zara', /-p\d+\.html$/i],
      'asos.com': ['ASOS', /\/prd\/\d+\/?$/i],
      'nordstrom.com': ['Nordstrom', /\/s\/[^/]+\/\d+\/?$/i],
      'ssense.com': ['SSENSE', /\/item\/[^/]+\/[^/]+\/\d+\/?$/i]
    };
    const store = stores[host];
    if (!store || !store[1].test(u.pathname) || [...u.searchParams.keys()].some(k => /^(url|redirect|redirect_uri|next|q|keyword)$/i.test(k))) return null;
    u.hash = '';
    return { url: u.href, site: store[0] };
  } catch { return null; }
}

function parsedPrice(value,currency=''){let raw=String(value??'').trim();if(!raw)return null;let cur=String(currency||'').toUpperCase();if(!cur){if(raw.includes('$'))cur='USD';else if(raw.includes('£'))cur='GBP';else if(raw.includes('€'))cur='EUR';else if(raw.includes('¥'))cur='JPY'}let normalized=raw.replace(/,/g,'').replace(/[^\d.\-]/g,'');let amount=Number(normalized);return Number.isFinite(amount)&&amount>0?{amount,currency:cur}:null}
function extractSearchPrice(item){let pm=item.pagemap||{},sources=[...(pm.offer||[]),...(pm.offers||[]),...(pm.product||[]),...(pm.metatags||[])];for(const x of sources){let amount=x.price||x.lowprice||x.lowPrice||x['product:price:amount']||x['og:price:amount']||x['twitter:data1'];let currency=x.pricecurrency||x.priceCurrency||x.currency||x['product:price:currency']||x['og:price:currency']||'';let parsed=parsedPrice(amount,currency);if(parsed)return parsed}return null}

function canDeletePost(post){return !!state.isAuthenticated&&!!state.currentUser?.id&&(post?.authorId===state.currentUser.id||!!post&&state.admin===true)}
function requestPostDeletion(id){

  openModal('Delete post?',`<p>Are you sure you want to delete this post?</p><p class="small muted">It will be removed from your feed and synced across your devices.</p><div class="row"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn danger" data-action="confirm-delete-post" data-id="${esc(id)}">Delete post</button></div>`);

async function confirmPostDeletion(id){
  const post=state.posts.find(post=>post.id===id);
  if(pendingPostDeletion?.id!==id||pendingPostDeletion.userId!==state.currentUser?.id||!canDeletePost(post)){
    closeModal();toast('This post is no longer available to delete.');return;

  if(post.authorId!==state.currentUser.id){try{await moderate({action:'delete-post',owner:post.authorId,post:id})}catch(error){toast(error.message);return}}
  state.posts=state.posts.filter(post=>post.id!==id);
  persist();closeModal();render();toast('Post deleted');

function renderBio(bio){

  for(const match of text.matchAll(pattern)){
    html+=esc(text.slice(last,match.index))+`<button type="button" class="bio-mention" data-action="bio-mention" data-username="${esc(match[1])}" aria-label="View @${esc(match[1])} profile">${esc(match[0])}</button>`;

  }

}

function readImage(file,maxDimension=1000){return new Promise((resolve,reject)=>{if(!file){resolve('');return}let url=URL.createObjectURL(file),img=new Image();img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image could not be read'))};img.onload=()=>{let scale=Math.min(1,maxDimension/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.src=url})}
document.addEventListener('submit',async e=>{if(e.target.id==="findSearchForm"){e.preventDefault();await runFindSearch(e.target);return}if(e.target.id==="findConfigForm"){e.preventDefault();let f=new FormData(e.target),cfg={provider:String(f.get("provider")),apiKey:String(f.get("apiKey")||"").trim(),cx:String(f.get("cx")||"").trim()};if(!cfg.apiKey){toast("Enter an API key.");return}if(cfg.provider==="cse"&&!cfg.cx){toast("Google Custom Search requires a CX search engine ID.");return}sessionStorage.setItem("wearhouse-find-api-v1",JSON.stringify(cfg));closeModal();render();toast("Search configured for this session");return}if(['authForm','resetLookupForm','resetPasswordForm'].includes(e.target.id)){
  e.preventDefault();const form=e.target,f=new FormData(form),button=form.querySelector('button');button.disabled=true;
  try{
    if(form.id==='resetLookupForm'){
      await identity.requestPasswordRecovery(String(f.get('email')).trim().toLowerCase());
      state.authMessage='Check your inbox for a password reset link.';render();return;
    }
    if(form.id==='resetPasswordForm'){
      if(f.get('password')!==f.get('confirm'))throw Error('The passwords do not match.');
      await identity.updateUser({password:String(f.get('password'))});state.resetStage='email';
      await enterCloud(await identity.getUser());toast('Password updated');return;
    }
    const email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));
    if(form.dataset.mode==='signup'){
      const user=await identity.signup(email,password,{full_name:String(f.get('name')).trim(),aesthetic:String(f.get('aesthetic'))});
      if(!(user.emailVerified||user.confirmedAt)){state.authMode='login';state.authMessage='Check your email to confirm your account, then log in.';render();return;}
      await enterCloud(user);
    }else await enterCloud(await identity.login(email,password));
  }catch(error){toast(error.message||'Unable to reach your cloud account. Please reconnect and try again.')}finally{button.disabled=false}
  return;
}if(e.target.id==='itemForm'){e.preventDefault();let f=new FormData(e.target),file=f.get('photo'),photo=file?.size?await readImage(file):'';state.wardrobe.push({id:uid(),name:String(f.get('name')).trim(),category:String(f.get('category')),color:String(f.get('color')),season:String(f.get('season')),style:String(f.get('style')),occasion:String(f.get('occasion')),brand:String(f.get('brand')||'').trim(),photo});persist();closeModal();render();toast('Piece added to your wardrobe');return}if(e.target.id==='postForm'){e.preventDefault();let f=new FormData(e.target),outfit=state.savedOutfits.find(o=>o.id===f.get('outfit')),file=f.get('photo'),image=file?.size?await readImage(file):'';if(!outfit&&!image){toast('Choose a saved outfit or upload a photo.');return}let piecesSnapshot=outfit?piecesOf(outfit).map(i=>({id:i.id,name:i.name,category:i.category,color:i.color,photo:i.photo||'',brand:i.brand||''})):[],post={id:uid(),authorId:state.currentUser.id,authorName:state.userProfile.name,username:state.userProfile.username,style:String(f.get('style')),caption:String(f.get('caption')).trim(),tags:String(f.get('tags')).split(/[\s,]+/).filter(Boolean).map(t=>t.replace(/^#/,'')).slice(0,8),image,likes:0,liked:false,bookmarked:false,outfitId:outfit?.id||null,piecesSnapshot,createdAt:Date.now()};state.posts.unshift(post);persist();closeModal();setTab('community');toast('Publishing to cloud… Keep this page open until saved.');return}if(e.target.id==='profileForm'){e.preventDefault();let f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),duplicate=state.users.some(u=>u.id!==state.currentUser.id&&u.email===email);if(duplicate){toast('This email belongs to another local profile.');return}state.userProfile={...state.userProfile,name:String(f.get('name')).trim(),username:String(f.get('username')||state.userProfile.username).trim().replace(/^@/,''),email,bio:String(f.get('bio')).trim(),aesthetic:String(f.get('aesthetic'))};state.currentUser={...state.currentUser,name:state.userProfile.name,email,aesthetic:state.userProfile.aesthetic};let account=state.users.find(u=>u.id===state.currentUser.id);if(account){account.name=state.userProfile.name;account.email=email;account.aesthetic=state.userProfile.aesthetic}persist();closeModal();render();toast('Profile updated · Syncing across devices')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&modalRoot.innerHTML){const nodes=[...modalRoot.querySelectorAll('button,input,select,textarea,iframe,a[href],[tabindex="0"]')].filter(x=>!x.disabled&&!x.hidden),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const r=document.createElement('i'),box=b.getBoundingClientRect(),size=Math.max(box.width,box.height)*1.6;r.className='ripple';r.style.width=r.style.height=size+'px';r.style.left=((e.clientX-box.left)||box.width/2)+'px';r.style.top=((e.clientY-box.top)||box.height/2)+'px';b.appendChild(r);setTimeout(()=>r.remove(),600)},true);
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();bootCloud();

function activeStory(s){return !!s&&!s.deleted&&Number.isFinite(Number(s.createdAt))&&Date.now()-Number(s.createdAt)<86400000}
syncStoryState();
// Public stories refresh independently of authentication, wardrobe sync, dialogs and playback.
async function refreshGlobalStories(){
 syncStoryState();
 if(storyRefreshBusy||document.hidden)return;
 storyRefreshBusy=true;
 try{await loadStories()}finally{storyRefreshBusy=false}
}
refreshGlobalStories();
setInterval(refreshGlobalStories,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshGlobalStories()});
window.addEventListener('focus',refreshGlobalStories);
window.addEventListener('online',refreshGlobalStories);

function highlightsView(owner){const folders=[...new Set(publicHighlights.filter(h=>h.owner===owner).map(h=>h.title))];return `<section class="storiesSection"><div class="storiesHead"><h2>Highlights · Repere</h2>${owner===state.currentUser?.id?'<button class="btn smallbtn" data-social="highlight-add">+ Save story</button>':''}</div><p class="small muted">Public · permanent collections</p><div class="storiesRail">${folders.map(title=>{const h=publicHighlights.find(h=>h.owner===owner&&h.title===title),story=archivedStories.find(s=>s.id===h.storyId);return `<button class="storyThumb" data-social="highlight-open" data-owner="${esc(owner)}" data-title="${esc(title)}">${story?`<img src="${esc(story.image)}" alt="">`:'<span class="storyAdd">○</span>'}<small>${esc(title)}</small></button>`}).join('')||'<p class="muted small">No highlights yet.</p>'}</div></section>`}
async function loadHighlights(){try{const before=JSON.stringify(publicHighlights);const r=await fetch('/.netlify/functions/highlights',{cache:'no-store'});if(!r.ok)throw Error();publicHighlights=(await r.json()).highlights;if(before!==JSON.stringify(publicHighlights)&&state.isAuthenticated&&(publicProfileId||state.activeTab==='profile')&&!modalRoot.innerHTML&&!storyActive)render();try{localStorage.setItem('wearhouse-highlights',JSON.stringify(publicHighlights))}catch{}}catch{try{publicHighlights=JSON.parse(localStorage.getItem('wearhouse-highlights'))||[]}catch{}}}
function noticeKey(){return 'wearhouse-notifications:'+state.currentUser?.id}
function notices(){try{return JSON.parse(localStorage.getItem(noticeKey()))||[]}catch{return []}}
function notificationContent(){return notices().slice().reverse().map(n=>`<article class="card"><button class="authorLink" data-action="public-profile" data-id="${esc(n.actor)}">@${profileText(n.actor,'username',n.username)}</button><p>${esc({'follow':'followed you.','post-like':'hearted your post.','story-like':'liked your story.','story-share':'shared your story.','story-comment':'commented on your story.'}[n.type]||'interacted with you.')}</p><small class="muted">${esc(new Date(n.createdAt).toLocaleString())}</small></article>`).join('')||'<p class="muted">No activity yet. New follows and reactions appear here.</p>'}
async function refreshNotifications(){if(!state.isAuthenticated)return;const owner=state.currentUser.id;try{const result=await api('notifications');if(owner!==state.currentUser?.id)return;const previous=notices(),items=result.notifications.map(n=>({...n,createdAt:n.createdAt||previous.find(p=>p.id===n.id)?.createdAt||Date.now()})).sort((a,b)=>a.createdAt-b.createdAt);localStorage.setItem(noticeKey(),JSON.stringify(items));const seen=Number(localStorage.getItem(noticeKey()+':seen')||0),count=items.filter(n=>n.createdAt>seen).length;document.querySelector('#notificationCount').textContent=count||'';const panel=document.querySelector('#notificationList');if(panel)panel.innerHTML=notificationContent()}catch{}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-social]');if(!b)return;const action=b.dataset.social;
 if(action==='back'){conversationPeer=null;render();document.querySelector('[data-social="inbox"]')?.focus()}
 if(action==='inbox'||action==='requests'){requestView=action==='requests';conversationPeer=null;render();refreshMessages()}
 if(action==='accept'||action==='decline'){b.disabled=true;try{await api('conversations',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({peer:b.dataset.id,action})});await refreshMessages();if(action==='accept'){requestView=false;openConversation(b.dataset.id)}else render()}catch{toast('Unable to update request. Please retry.');b.disabled=false}}
 if(action==='notifications'){openModal('Notifications',`<div id="notificationList" class="stack">${notificationContent()}</div>`);await refreshNotifications();localStorage.setItem(noticeKey()+':seen',String(Date.now()));document.querySelector('#notificationCount').textContent=''}
 if(action==='highlight-open'){const ids=publicHighlights.filter(h=>h.owner===b.dataset.owner&&h.title===b.dataset.title).map(h=>h.storyId);storyHighlightMode=true;storyList=archivedStories.filter(s=>ids.includes(s.id));if(storyList.length)showStory(0);else toast('These stories are no longer available.')}
 if(action==='highlight-add'){await loadStories();const own=archivedStories.filter(s=>s.authorId===state.currentUser.id);openModal('Save to public highlights',own.length?`<form id="highlightForm" class="stack"><p class="muted">Active and expired stories can be saved. Everyone can watch your highlights.</p><label class="field">Folder name<input name="title" maxlength="40" required placeholder="Everyday looks"></label><label class="field">Story<select name="storyId">${own.map(s=>`<option value="${esc(s.id)}">${esc(s.caption||new Date(s.createdAt).toLocaleString())}${activeStory(s)?'':' · Archived'}</option>`).join('')}</select></label><button class="btn primary">Save highlight</button><p role="status"></p></form>`:'<p>Publish a story to start your highlights.</p>')}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='highlightForm')return;e.preventDefault();const form=e.target,button=form.querySelector('button');button.disabled=true;try{await api('highlights',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});await loadHighlights();closeModal();render()}catch{form.querySelector('[role="status"]').textContent='Unable to save. Please retry.';button.disabled=false}});
loadHighlights();
setInterval(()=>{if(!document.hidden&&state.isAuthenticated){refreshNotifications();if(!storyActive&&!modalRoot.innerHTML){loadHighlights();if(state.activeTab==='home'||state.activeTab==='community'){const expired=document.querySelectorAll('.storiesRail [data-action="story-open"]');if([...expired].some(b=>!activeStory(globalStories.find(s=>s.id===b.dataset.id)||{})))render()}}}},4000);
window.addEventListener('storage',e=>{if(e.key===noticeKey()){const panel=document.querySelector('#notificationList');if(panel)panel.innerHTML=notificationContent()}if(e.key===socialCacheKey()+':requests'){try{messageRequests=JSON.parse(e.newValue)||[]}catch{}if(state.activeTab==='community')render()}});
})();
